<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Reading Room - Note Book VN</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        #ui-overlay {
            position: absolute; top: 10px; left: 10px; color: white;
            font-family: sans-serif; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px;
        }
    </style>
    <!-- Nhúng thư viện Three.js từ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-overlay">
        <h2>Phòng Đọc Sách Note Book VN</h2>
        <p>Trạng thái: Đang kết nối Supabase...</p>
    </div>

    <script>
        // 1. Khởi tạo Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng cơ bản
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // 2. Tạo sàn phòng đọc sách
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d2817 }); // Màu gỗ tối
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3. Tạo mẫu bàn đọc sách tượng trưng (Ví dụ Bàn số 1)
        const tableGeo = new THREE.BoxGeometry(2, 0.5, 1.5);
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const table1 = new THREE.Mesh(tableGeo, tableMat);
        table1.position.set(-3, 0.25, 0);
        scene.add(table1);

        // Đặt camera nhìn vào không gian
        camera.position.set(0, 10, 12);
        camera.lookAt(0, 0, 0);

        // Vòng lặp render animation
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Xử lý khi resize màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
