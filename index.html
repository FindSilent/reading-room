<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>3D Reading Room - Note Book VN</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #ui-overlay {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; z-index: 10;
            max-width: 320px;
        }
        .status-ok { color: #4ade80; }
        
        /* Modal nhập tên khi click vào bàn */
        #seat-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #222; color: white; padding: 25px; border-radius: 12px; z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #444;
        }
        #seat-modal input {
            padding: 10px; width: 80%; margin: 15px 0; border-radius: 6px; border: 1px solid #555;
            background: #111; color: white; font-size: 16px;
        }
        #seat-modal button {
            padding: 10px 20px; background: #f59e0b; border: none; border-radius: 6px;
            color: black; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        #seat-modal button:hover { background: #d97706; }
    </style>
    <!-- Three.js & Supabase Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="ui-overlay">
        <h2>Phòng Đọc Sách Note Book VN</h2>
        <p id="status-text">Trạng thái: Đang kết nối Supabase...</p>
        <p><small><b>Hướng dẫn:</b> Click trực tiếp vào bàn đọc sách 3D bất kỳ để chọn chỗ ngồi và nhập tên của bạn.</small></p>
    </div>

    <!-- Hộp thoại nhập tên khi click ghế -->
    <div id="seat-modal">
        <h3 id="modal-title">Ngồi vào bàn</h3>
        <p>Nhập tên tài khoản hoặc tên của bạn:</p>
        <input type="text" id="viewer-name-input" placeholder="Ví dụ: Note Book VN..." autocomplete="off">
        <br>
        <button onclick="confirmTakeSeat()">Xác nhận ngồi</button>
        <button onclick="closeModal()" style="background:#555; color:white; margin-left: 10px;">Hủy</button>
    </div>

    <script>
        // 1. Cấu hình Supabase (Thay thông số của bạn vào đây)
        const SUPABASE_URL = 'https://qlhtspfaumebrhgkvcop.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_O49pJRLFc0RlTzfGR9EzOA_aV7d7Es6'; // Điền Publishable key của bạn
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Khởi tạo Scene 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 9, 14);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Sàn nhà phòng đọc
        const floorGeo = new THREE.PlaneGeometry(24, 24);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c1d11, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3. Định nghĩa danh sách bàn
        const tablesData = [
            { id: 1, name: "Bàn VIP 1", x: -4, z: -2 },
            { id: 2, name: "Bàn VIP 2", x: 0, z: -2 },
            { id: 3, name: "Bàn VIP 3", x: 4, z: -2 },
            { id: 4, name: "Bàn Thường 1", x: -4, z: 2 },
            { id: 5, name: "Bàn Thường 2", x: 0, z: 2 },
            { id: 6, name: "Bàn Thường 3", x: 4, z: 2 }
        ];

        const interactiveObjects = []; // Mảng chứa các đối tượng có thể click
        const tableMeshes = {}; 
        const avatarMeshes = {}; 

        const tableMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const chairMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const emptySeatColor = 0x444444;
        const occupiedSeatColor = 0x3b82f6;

        tablesData.forEach(tData => {
            const tableGroup = new THREE.Group();

            // Mặt bàn
            const tableGeo = new THREE.BoxGeometry(2.2, 0.4, 1.4);
            const tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.position.y = 0.8;
            tableGroup.add(tableMesh);

            // Ghế ngồi (đối tượng để người dùng click chọn)
            const chairGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const chairMesh = new THREE.Mesh(chairGeo, chairMat);
            chairMesh.position.set(0, 0.4, 1.1);
            chairMesh.userData = { seatId: tData.id, seatName: tData.name }; // Gắn ID bàn vào mesh để nhận diện click
            tableGroup.add(chairMesh);

            tableGroup.position.set(tData.x, 0, tData.z);
            scene.add(tableGroup);

            tableMeshes[tData.id] = chairMesh;
            interactiveObjects.push(chairMesh); // Thêm ghế vào danh sách bắt sự kiện click
        });

        // 4. Hàm vẽ/cập nhật Avatar trên ghế
        function updateSeatInScene(seatId, status, viewerName) {
            const chair = tableMeshes[seatId];
            if (!chair) return;

            if (status === 'occupied') {
                chair.material.color.setHex(occupiedSeatColor);

                if (!avatarMeshes[seatId]) {
                    const avatarGroup = new THREE.Group();

                    // Thân nhân vật
                    const bodyGeo = new THREE.BoxGeometry(0.6, 0.9, 0.6);
                    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
                    const body = new THREE.Mesh(bodyGeo, bodyMat);
                    body.position.set(0, 0.85, 0);
                    avatarGroup.add(body);

                    // Đầu nhân vật
                    const headGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                    const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
                    const head = new THREE.Mesh(headGeo, headMat);
                    head.position.set(0, 1.5, 0);
                    avatarGroup.add(head);

                    // Bảng tên (Canvas Texture)
                    const canvas = document.createElement('canvas');
                    canvas.width = 256; canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                    ctx.roundRect(0, 0, 256, 64, 10);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(viewerName || "Khách", 128, 40);

                    const texture = new THREE.CanvasTexture(canvas);
                    const spriteMat = new THREE.SpriteMaterial({ map: texture });
                    const sprite = new THREE.Sprite(spriteMat);
                    sprite.scale.set(1.5, 0.4, 1);
                    sprite.position.set(0, 2.1, 0);
                    avatarGroup.add(sprite);

                    avatarGroup.position.copy(chair.parent.position).add(chair.position);
                    avatarGroup.position.y = 0;
                    scene.add(avatarGroup);
                    avatarMeshes[seatId] = avatarGroup;
                }
            } else {
                chair.material.color.setHex(emptySeatColor);
                if (avatarMeshes[seatId]) {
                    scene.remove(avatarMeshes[seatId]);
                    delete avatarMeshes[seatId];
                }
            }
        }

        // 5. Xử lý sự kiện Raycaster (Click chuột vào bàn 3D)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedSeatId = null;

        window.addEventListener('click', (event) => {
            // Chuyển đổi tọa độ chuột sang không gian chuẩn hóa của WebGL (-1 đến +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                const clickedChair = intersects[0].object;
                selectedSeatId = clickedChair.userData.seatId;
                
                // Mở Modal nhập tên
                document.getElementById('modal-title').innerText = `Ngồi vào: ${clickedChair.userData.seatName}`;
                document.getElementById('seat-modal').style.display = 'block';
                document.getElementById('viewer-name-input').focus();
            }
        });

        function closeModal() {
            document.getElementById('seat-modal').style.display = 'none';
            selectedSeatId = null;
        }

        // Hàm gửi dữ liệu lên Supabase khi người dùng xác nhận tên
        async function confirmTakeSeat() {
            const viewerName = document.getElementById('viewer-name-input').value.trim();
            if (!viewerName) {
                alert('Vui lòng nhập tên của bạn!');
                return;
            }

            // Cập nhật dữ liệu vào bảng seats trên Supabase
            const { error } = await supabaseClient
                .from('seats')
                .update({ status: 'occupied', current_viewer: viewerName })
                .eq('id', selectedSeatId);

            if (error) {
                alert('Lỗi cập nhật ghế: ' + error.message);
            } else {
                closeModal();
                document.getElementById('viewer-name-input').value = '';
            }
        }

        // 6. Đồng bộ dữ liệu ban đầu và Realtime từ Supabase
        async function fetchInitialSeats() {
            const { data, error } = await supabaseClient.from('seats').select('*');
            if (error) {
                document.getElementById('status-text').innerHTML = '<span style="color:red">Lỗi kết nối bảng seats!</span>';
                console.error(error);
            } else {
                document.getElementById('status-text').innerHTML = '<span class="status-ok">Trạng thái: Đã kết nối & Đồng bộ Realtime!</span>';
                data.forEach(seat => {
                    updateSeatInScene(seat.id, seat.status, seat.current_viewer);
                });
            }
        }
        fetchInitialSeats();

        supabaseClient
            .channel('public:seats')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'seats' }, payload => {
                const updatedSeat = payload.new;
                updateSeatInScene(updatedSeat.id, updatedSeat.status, updatedSeat.current_viewer);
            })
            .subscribe();

        // 7. Vòng lặp Render 3D
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
